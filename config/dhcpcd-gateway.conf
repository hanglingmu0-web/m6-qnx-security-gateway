# WAN IPv4 only; interface is selected by measured MAC at boot.
clientid
vendorclassid
ipv4only
noipv4ll
option subnet_mask, routers, domain_name_servers
require dhcp_server_identifier
require subnet_mask
require routers
require domain_name_servers
# Do not install additional server-supplied routes into the downstream LAN.
nooption static_routes
nooption classless_static_routes
nooption ms_classless_static_routes
