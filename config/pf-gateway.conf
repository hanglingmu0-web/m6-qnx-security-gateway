# C6 -> A (DHCP), B -> downstream LAN. No unsolicited upstream access.
set block-policy drop
# Separate B ingress/RDR and A egress/NAT states and filter both crossings.
set state-policy if-bound
set ruleset-optimization none
nat on @A_IF@ inet from 192.168.77.0/24 to any -> (@A_IF@)
# No DNS server daemon: redirect the LAN gateway's DNS address to leased DNS.
rdr on @B_IF@ inet proto udp from 192.168.77.0/24 to 192.168.77.1 port 53 -> @WAN_DNS@ port 53
rdr on @B_IF@ inet proto tcp from 192.168.77.0/24 to 192.168.77.1 port 53 -> @WAN_DNS@ port 53
block all label "M6_DEFAULT_DENY"
# Existing states are checked first. TCP-only counter excludes incidental ping probes.
# Other new upstream traffic remains covered by M6_DEFAULT_DENY.
block in quick on @A_IF@ inet proto tcp from any to 192.168.77.0/24 label "M6_WAN_TO_LAN_DENY"
pass out quick on @A_IF@ inet proto udp from any port 68 to any port 67 no state label "M6_DHCP_OUT"
pass in quick on @A_IF@ inet proto udp from any port 67 to (@A_IF@) port 68 no state label "M6_DHCP_IN"
pass in quick on @A_IF@ inet proto udp from any port 67 to 255.255.255.255 port 68 no state label "M6_DHCP_BCAST"
pass in quick on @B_IF@ inet proto icmp from 192.168.77.0/24 to 192.168.77.1 icmp-type echoreq keep state label "M6_LAN_PING"
pass in quick on @B_IF@ inet proto tcp from 192.168.77.0/24 to 192.168.77.1 port 18080 flags S/SA keep state label "M6_DIAGNOSTIC"
# PF evaluates the redirected destination. Only the leased DNS gets this exception.
pass in quick on @B_IF@ inet proto udp from 192.168.77.0/24 to @WAN_DNS@ port 53 tag M6_LAN_ALLOWED keep state label "M6_DNS_UDP"
pass in quick on @B_IF@ inet proto tcp from 192.168.77.0/24 to @WAN_DNS@ port 53 flags S/SA tag M6_LAN_ALLOWED keep state label "M6_DNS_TCP"
block in quick on @B_IF@ inet from any to 192.168.77.1 label "M6_SELF_DENY"
block in quick on @B_IF@ inet from any to (@A_IF@:network) label "M6_UPSTREAM_DENY"
pass in quick on @B_IF@ inet from 192.168.77.0/24 to any tag M6_LAN_ALLOWED keep state label "M6_LAN_OUT"
# Filter sees the translated source. Only traffic admitted above gets this tag.
pass out quick on @A_IF@ inet from (@A_IF@) to any tagged M6_LAN_ALLOWED keep state label "M6_WAN_OUT"
